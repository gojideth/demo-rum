server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/demo-failure {
        default_type application/json;
        return 500 '{"error":"Error intencional de la demostración del taller"}';
    }

    location ~* \.map$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
